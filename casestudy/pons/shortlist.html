<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RemoteReps — The Shortlist (v15)</title>
<style>
  :root{ --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  *{box-sizing:border-box}
  body{margin:0;background:#0E1318;color:#E7E8EA;font-family:var(--sans);
       display:flex;flex-direction:column;align-items:center;gap:16px;padding:28px 16px;min-height:100vh}
  #box{width:100%;max-width:540px;aspect-ratio:4/5;position:relative;overflow:hidden;border-radius:14px}
  .ctl{width:100%;max-width:540px;display:flex;align-items:center;gap:12px}
  button{height:38px;min-width:38px;padding:0 12px;border-radius:8px;border:1px solid #39404A;
         background:#181D23;color:#E7E8EA;cursor:pointer;font:400 14px var(--sans)}
  button:hover{background:#222831}
  input[type=range]{flex:1;accent-color:#4F97F0}
  #tl{font:400 13px ui-monospace,monospace;color:#8C96A1;min-width:96px;text-align:right}
  #beat{width:100%;max-width:540px;text-align:center;font-size:13px;color:#8C96A1}
  /* clean = no UI chrome; on by default when embedded in the portfolio card */
  body.clean{background:#10171F;padding:0;justify-content:center;gap:0;min-height:100vh;overflow:hidden}
  body.clean .ctl,body.clean #beat{display:none}
  body.clean #box{border-radius:0;max-width:none;width:min(100vw,80vh)}

  @property --ga { syntax: '<angle>'; initial-value: 0deg; inherits: true; }
  .gstroke{
    border:2.5px solid transparent !important;
    background-image:linear-gradient(168deg,#FCFCFD 0%,#EFF0F2 100%),conic-gradient(from var(--ga),#6CC4F7,#7E93F2,#9A6CF1,#BC49F3,#DE38F7,#BC49F3,#7E93F2,#6CC4F7) !important;
    background-origin:padding-box,border-box !important;
    background-clip:padding-box,border-box !important;
  }
  .gstroke .av,.gstroke .tag{filter:grayscale(1)}
</style>
</head>
<body>
<div id="box">
  <div id="stage" style="position:absolute;top:0;left:0;width:1080px;height:1350px;transform-origin:0 0;background:radial-gradient(ellipse at 50% 26%,#31445A 0%,#1C2836 58%,#10171F 100%);overflow:hidden">
    <div id="cam" style="position:absolute;left:0;top:0;width:1080px;height:1350px;transform-origin:0 0">
      <div id="floor" style="position:absolute;left:130px;top:1228px;width:820px;height:74px;border-radius:50%;background:radial-gradient(ellipse,rgba(4,8,14,.62) 0%,rgba(4,8,14,0) 72%)"></div>
      <div id="dev" style="position:absolute;left:60px;top:90px;width:960px;height:1170px;background:#fff;border-radius:44px;overflow:hidden;box-shadow:0 72px 130px rgba(4,9,16,.55),0 24px 46px rgba(4,9,16,.38),0 2px 5px rgba(4,9,16,.30),inset 0 2px 0 rgba(255,255,255,.9)">
        <div style="position:absolute;inset:0;overflow:hidden">

            <div style="position:absolute;left:36px;top:30px;width:40px;height:40px;border-radius:5px 17px 17px 17px;background:linear-gradient(180deg,#508CFF,#005AC8);box-shadow:0 4px 10px rgba(13,74,166,.34)"></div>
            <svg style="position:absolute;left:36px;top:30px" width="40" height="40" viewBox="0 0 96 96"><path d="M23 52 A25 25 0 0 0 73 52" stroke="#fff" stroke-width="14" stroke-linecap="round" fill="none"/></svg>
            <div style="position:absolute;left:100px;top:28px;width:748px;height:44px;border-radius:22px;background:#EFF2F6;box-shadow:inset 0 1px 3px rgba(24,38,56,.10)"></div>
            <div style="position:absolute;left:148px;top:45px;width:190px;height:10px;border-radius:5px;background:#C9D1DA"></div>
            <div id="acct" style="position:absolute;left:872px;top:30px;width:40px;height:40px;border-radius:50%;background:linear-gradient(160deg,#DDE3EA,#C6CFD9)"></div>
            <div id="pills"></div>
          </div>
          <div id="base" style="position:absolute;left:0;top:180px;width:960px;transform-origin:50% 0;z-index:2"></div>
          <div id="keep" style="position:absolute;left:0;top:180px;width:960px;transform-origin:50% 0;z-index:5"></div>
          <div id="vig" style="position:absolute;left:0;top:180px;width:960px;height:990px;pointer-events:none;z-index:7;background:linear-gradient(180deg,rgba(20,32,48,.16) 0%,rgba(20,32,48,0) 17%,rgba(20,32,48,0) 71%,rgba(20,32,48,.20) 100%)"></div>
          <div id="wash" style="position:absolute;inset:0;pointer-events:none;z-index:9;opacity:0;mix-blend-mode:screen;background:linear-gradient(90deg,rgba(108,196,247,.75),rgba(126,147,242,.6),rgba(154,108,241,.6),rgba(188,73,243,.6),rgba(222,56,247,.7))"></div>
          <div id="scan" style="position:absolute;left:0;top:0;width:960px;height:620px;pointer-events:none;z-index:10;opacity:0;mix-blend-mode:screen;background:linear-gradient(90deg,#6CC4F7,#7E93F2,#9A6CF1,#BC49F3,#DE38F7);-webkit-mask-image:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.10) 38%,rgba(0,0,0,.42) 60%,rgba(0,0,0,1) 70%,rgba(0,0,0,.95) 73%,rgba(0,0,0,.38) 79%,rgba(0,0,0,0) 100%);mask-image:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.10) 38%,rgba(0,0,0,.42) 60%,rgba(0,0,0,1) 70%,rgba(0,0,0,.95) 73%,rgba(0,0,0,.38) 79%,rgba(0,0,0,0) 100%)"></div>
          <div id="edge" style="position:absolute;left:0;top:0;width:960px;height:7px;pointer-events:none;z-index:11;opacity:0;mix-blend-mode:screen;background:linear-gradient(90deg,#9FDCFF,#B7C4FF,#CDA9FF,#E38EFF,#FF8BFA);filter:blur(2px)"></div>
          <div id="phone" style="position:absolute;left:872px;top:30px;width:40px;height:40px;border-radius:50%;z-index:12;opacity:0;transform-origin:50% 50%;background:linear-gradient(170deg,#508CFF,#005AC8);box-shadow:0 4px 12px rgba(13,74,166,.42)">
            <svg width="100%" height="100%" viewBox="0 0 28 28"><path d="M8.6 12.8c1.4 2.8 3.8 5.2 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.4.6 3.6.6.6 0 1 .4 1 1V22c0 .6-.4 1-1 1C12.6 23 5 15.4 5 6c0-.6.4-1 1-1h3.4c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.4 0 .8-.2 1L8.6 12.8z" fill="#fff"/></svg>
          </div>
        </div>
      </div>
    </div>
    <div id="final" style="position:absolute;left:0;top:0;width:620px;height:660px;transform-origin:0 0;opacity:0;border-radius:30px;border:3px solid #12996A;box-sizing:border-box;background:linear-gradient(170deg,#FFFFFF 0%,#F7FCFA 52%,#EDF7F2 100%);box-shadow:0 40px 90px rgba(3,8,14,.55),0 10px 26px rgba(3,8,14,.35)"></div>
    <div id="end" style="position:absolute;left:0;top:0;width:1080px;height:1350px;opacity:0">
      <div id="n1" style="position:absolute;left:0;top:766px;width:1080px;text-align:center;font:700 94px/1.05 var(--sans);letter-spacing:-.035em;color:#F4F7FA;text-shadow:0 8px 40px rgba(0,0,0,.45)">This one.</div>
      <div id="n2" style="position:absolute;left:0;top:865px;width:1080px;text-align:center;font:700 94px/1.05 var(--sans);letter-spacing:-.035em;color:#F4F7FA;text-shadow:0 8px 40px rgba(0,0,0,.45)">She&rsquo;s the right fit.</div>
    </div>
  </div>
</div>
<div class="ctl">
  <button id="pp">&#10073;&#10073;</button>
  <input id="scrub" type="range" min="0" max="5100" step="1" value="0">
  <span id="tl">0.0s / 25.5s</span>
</div>
<div id="beat">Corner</div>

<script>
(function(){
/* ================================================================
   TIMING — every beat, in seconds. Edit these first.
   ================================================================ */
var DUR = 25.5;
var T = {
  zoom:    1.6,    // camera pull-back from the corner ends
  rushEnd: 3.6,    // fast scroll ends            -> hold 1s
  upStart: 4.6,    // scroll back up begins
  upEnd:   5.6,    // scroll back up ends         -> hold 1s
  dnStart: 6.6,    // nudge down begins
  dnEnd:   6.85,   // nudge down ends             -> hold 1s
  resume:  7.85,   // colour drains out of the grid
  scan:    9.15,   // gradient scan light sweeps (1.5s)
  stroke: 10.65,   // gradient runs the card borders (1.0s)
  phone:  10.65,   // phone icon lands (0.65s) — same start as stroke
  gain:   11.65,   // three cards regain colour + blue badges
  vanish: 13.8,    // the rest clear out
  conv:   15.4,    // three converge to a centred stack
  pulse:  16.7,    // each stands out, one by one
  green:  18.3,    // middle badge turns green
  hero:   19.2,    // middle card grows, moves to top of frame
  hand:   21.35,   // handoff to the standalone endcard card
  devOut: 21.4,    // frame dissolves
  move:   21.7,    // card shrinks and rises to endcard position
  endIn:  22.3     // closing lines rise in
};
var SCAN=1.5, STROKE=1.0, PH=0.65;
var CAM={s:3.6,tx:-76,ty:-124};   // opening zoom on the corner
var CREEP=0.038;                   // slow push-in during the search

/* ================================================================
   PALETTE
   ================================================================ */
var BLU="#1D6FE0",BLU2="#4F97F0",GRN="#12996A",GRN2="#31C48D";
var SKIN=["#E8BE9A","#C0805A","#8A5636","#F2D5BB","#A56A38","#66401F","#DCA478"];
var HAIR=["#241B13","#453020","#7A5230","#141414","#63432A","#372619","#9A7247"];
var TOP=["#3E5F86","#6E8560","#8A6060","#4E5B6B","#5E7688","#6D6188","#87795A","#4F776B"];
var AVBG=["#DDE6F1","#EFE7DA","#DEEBE3","#F0E2E5","#E4E1F0","#EFEADA"];
var TINT=["#E9EEF6","#F1EDE5","#E7F0EB","#F3EAEC","#EBE9F4","#F2EFE6"];

/* ================================================================
   LAYOUT
   ================================================================ */
var COLS=4,CW=210,CH=150,GAP=16,X0=36,PITCH=166,ROWS=50,N=ROWS*COLS,GT=180;
var REST=-41*PITCH+6;   // resting scroll position
var P1=REST-480;        // overshoot at the end of the rush
var P2=REST+130;        // overshoot at the top of the scroll back
var KEEP=[169,178,184]; // surviving cards (grid indices)
var HERO=1;             // which survivor becomes the hero (0,1,2)
var BW=620,BH=190,BX=170;        // converged card
var HW=620,HH=660,HX=170,HYD=110;// hero card, top of frame
var FX=355,FY=270,FS=0.597;      // endcard card position + scale

function av(s){
 var sk=SKIN[s%SKIN.length],h=HAIR[(s*3)%HAIR.length],tp=TOP[(s*5)%TOP.length],bg=AVBG[(s*7)%AVBG.length],v=s%4;
 var cap='<path d="M19 26 q0 -13 13 -13 q13 0 13 13 q-3 -6 -13 -6 q-10 0 -13 6 z" fill="'+h+'"/>';
 var hair=cap;
 if(v===1)hair=cap+'<rect x="16.5" y="22" width="5" height="19" rx="2.5" fill="'+h+'"/><rect x="42.5" y="22" width="5" height="19" rx="2.5" fill="'+h+'"/>';
 if(v===2)hair=cap+'<circle cx="32" cy="9" r="6" fill="'+h+'"/><rect x="17" y="23" width="4.5" height="16" rx="2.2" fill="'+h+'"/><rect x="42.5" y="23" width="4.5" height="16" rx="2.2" fill="'+h+'"/>';
 if(v===3)hair='<path d="M20 24 q1 -11 12 -11 q11 0 12 11 q-4 -4 -12 -4 q-8 0 -12 4 z" fill="'+h+'"/>';
 return '<div style="width:100%;height:100%;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 34% 26%,'+bg+' 0%,'+bg+' 52%,rgba(30,44,62,.13) 100%);box-shadow:inset 0 -2px 5px rgba(24,38,56,.13)"><svg width="100%" height="100%" viewBox="0 0 64 64"><path d="M32 41 c-13 0 -21 9 -22 25 h44 c-1 -16 -9 -25 -22 -25 z" fill="'+tp+'"/><circle cx="32" cy="27" r="13" fill="'+sk+'"/>'+hair+'</svg></div>';
}
var S={halo:[105,75,0,0],av:[16,16,40,40],b1:[68,26,84,10],b2:[68,46,74,8],b3:[16,84,178,8],b4:[16,102,116,8],bg:[162,14,32,32],rg:[156,8,44,44]};
var L={halo:[310,95,0,0],av:[28,56,78,78],b1:[126,54,200,14],b2:[126,84,136,11],b3:[126,112,240,10],b4:[126,138,110,24],bg:[536,67,56,56],rg:[522,53,84,84]};
var H={halo:[140,40,340,340],av:[190,90,240,240],b1:[160,400,300,26],b2:[210,446,200,18],b3:[185,484,250,15],b4:[225,522,170,36],bg:[352,248,92,92],rg:[338,234,120,120]};

var box=document.getElementById("box"),stage=document.getElementById("stage"),cam=document.getElementById("cam");
function fit(){stage.style.transform="scale("+(box.clientWidth/1080)+")";}
fit();new ResizeObserver(fit).observe(box);
var pl=document.getElementById("pills"),pw=[148,118,168,146],px=36;
pw.forEach(function(w){pl.insertAdjacentHTML("beforeend",'<div style="position:absolute;left:'+px+'px;top:100px;width:'+w+'px;height:44px;border-radius:22px;background:#fff;border:1.5px solid #DFE5EC;box-sizing:border-box;box-shadow:0 1px 2px rgba(24,38,56,.07)"></div><div style="position:absolute;left:'+(px+w*0.25)+'px;top:118px;width:'+(w*0.5)+'px;height:9px;border-radius:5px;background:#BCC5D0"></div>');px+=w+12;});
function lp(a,b,p){return a+(b-a)*p;}
function mix(c1,c2,p){var a=[parseInt(c1.substr(1,2),16),parseInt(c1.substr(3,2),16),parseInt(c1.substr(5,2),16)];
 var b=[parseInt(c2.substr(1,2),16),parseInt(c2.substr(3,2),16),parseInt(c2.substr(5,2),16)];
 return "rgb("+Math.round(lp(a[0],b[0],p))+","+Math.round(lp(a[1],b[1],p))+","+Math.round(lp(a[2],b[2],p))+")";}

var base=document.getElementById("base"),keepL=document.getElementById("keep"),cards=[],kp=[],strokeSet=[];
for(var i=0;i<N;i++){var r=Math.floor(i/COLS),c=i%COLS,ki=KEEP.indexOf(i),keep=ki>=0;
 var tn=TINT[i%TINT.length];
 var d=document.createElement("div");
 d.style.cssText="position:absolute;width:210px;height:150px;border-radius:15px;left:0;top:0;box-sizing:border-box;will-change:transform,opacity;background:linear-gradient(168deg,#FFFFFF 0%,"+tn+" 100%);box-shadow:0 1px 2px rgba(20,33,50,.07),0 5px 12px rgba(20,33,50,.06)";
 d.style.setProperty("--tint",tn);
 d.innerHTML='<div class="halo" style="position:absolute;left:105px;top:75px;width:0;height:0;border-radius:50%;background:radial-gradient(circle at 40% 34%,#E8F6EF 0%,#D8EDE3 62%,#CDE7DA 100%);opacity:0"></div>'+
 '<div class="av" style="position:absolute;left:16px;top:16px;width:40px;height:40px">'+av(i)+'</div>'+
 '<div class="b1" style="position:absolute;left:68px;top:26px;width:'+(keep?84:108)+'px;height:10px;border-radius:6px;background:#96A3B4"></div>'+
 '<div class="b2" style="position:absolute;left:68px;top:46px;width:74px;height:8px;border-radius:5px;background:#BAC5D2"></div>'+
 '<div class="b3" style="position:absolute;left:16px;top:84px;width:178px;height:8px;border-radius:5px;background:#CAD3DD"></div>'+
 '<div class="b4" style="position:absolute;left:16px;top:102px;width:116px;height:8px;border-radius:5px;background:#D6DDE5"></div>'+
 '<div class="tag" style="position:absolute;left:16px;top:120px;width:66px;height:18px;border-radius:9px;background:rgba(29,111,224,.10)"></div>'+
 (keep?'<div class="rg" style="position:absolute;left:156px;top:8px;width:44px;height:44px;border-radius:50%;border:2px solid '+BLU+';opacity:0"></div><div class="bg" style="position:absolute;left:162px;top:14px;width:32px;height:32px;border-radius:50%;opacity:0"><svg width="100%" height="100%" viewBox="0 0 44 44"><path d="M13 22.5 L19.5 29 L31 17.5" stroke="#fff" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg></div>':'');
 (keep?keepL:base).appendChild(d);
 var dir=c<2?-1:1,j=((i*37)%13)/12,d0=Math.max(0,(r-41))*0.10+c*0.065;
 var o={el:d,x:X0+c*(CW+GAP),y:r*PITCH,keep:keep,k:ki,dly:d0,tint:tn,ex:dir<0?-370-j*150:1100+j*150,rot:dir*(10+j*8)};
 if(r>=40&&r<=47)strokeSet.push(d);
 if(keep){o.q={};["halo","av","b1","b2","b3","b4","tag","bg","rg"].forEach(function(n){o.q[n]=d.querySelector("."+n);});
  o.ty=270+ki*220-REST-GT; d.style.zIndex=(ki===HERO?4:2); kp.push(o);}
 cards.push(o);}
base.style.height=(ROWS*PITCH)+"px";
var HY=HYD-GT-REST;

var fin=document.getElementById("final");
function bxs(g){return "left:"+g[0]+"px;top:"+g[1]+"px;width:"+g[2]+"px;height:"+g[3]+"px;";}
fin.innerHTML='<div style="position:absolute;'+bxs(H.halo)+'border-radius:50%;background:radial-gradient(circle at 40% 34%,#E8F6EF 0%,#D8EDE3 62%,#CDE7DA 100%)"></div>'+
 '<div style="position:absolute;'+bxs(H.av)+'">'+av(178)+'</div>'+
 '<div style="position:absolute;'+bxs(H.b1)+'border-radius:13px;background:#96A3B4"></div>'+
 '<div style="position:absolute;'+bxs(H.b2)+'border-radius:9px;background:#BAC5D2"></div>'+
 '<div style="position:absolute;'+bxs(H.b3)+'border-radius:8px;background:#CAD3DD"></div>'+
 '<div style="position:absolute;'+bxs(H.b4)+'border-radius:18px;background:rgba(18,153,106,.13)"></div>'+
 '<div style="position:absolute;'+bxs(H.bg)+'border-radius:50%;background:linear-gradient(160deg,'+GRN2+','+GRN+');box-shadow:0 6px 20px rgba(12,140,95,.5)"><svg width="100%" height="100%" viewBox="0 0 44 44"><path d="M13 22.5 L19.5 29 L31 17.5" stroke="#fff" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg></div>';

var dev=document.getElementById("dev"),end=document.getElementById("end"),chrome=document.getElementById("chrome"),vig=document.getElementById("vig");
var floor=document.getElementById("floor"),scan=document.getElementById("scan"),edge=document.getElementById("edge"),wash=document.getElementById("wash");
var phone=document.getElementById("phone"),acct=document.getElementById("acct");
var BEATS=[[1.6,"Corner, pulling back"],[3.6,"Rushing down"],[4.6,"Lost"],[5.6,"Scrolling back up"],[6.6,"Still lost"],[6.85,"Nudge down"],[7.85,"Overwhelmed"],[8.15,"Drain"],[9.15,"Grey, holding"],[10.65,"Scanning"],[11.65,"Borders light, phone lands"],[12.8,"Colour and badge"],[13.8,"Marked, holding"],[15.4,"Clear the rest"],[16.7,"Converge"],[18.3,"Stand out, one by one"],[19.2,"One turns green"],[21.35,"This one"],[22.5,"Frame clears, card stays"],[25.5,"Endcard"]];
function cl(v,a,b){return v<a?a:v>b?b:v;}
function sp(t,a,b){return cl((t-a)/(b-a),0,1);}
function oc(p){return 1-Math.pow(1-p,3);}
function ob(p){return 1+2.6*Math.pow(p-1,3)+1.9*Math.pow(p-1,2);}
function eio(p){return p<0.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;}
function scrollAt(t){
 if(t<=T.zoom)return 0;
 if(t<T.rushEnd)return lp(0,P1,Math.pow(sp(t,T.zoom,T.rushEnd),1.9));
 if(t<T.upStart)return P1;
 if(t<T.upEnd)return lp(P1,P2,eio(sp(t,T.upStart,T.upEnd)));
 if(t<T.dnStart)return P2;
 if(t<T.dnEnd)return lp(P2,REST,eio(sp(t,T.dnStart,T.dnEnd)));
 return REST;
}
function bx(el,a,b,c,cp,hp,rad){var o=[],j;for(j=0;j<4;j++){o[j]=lp(lp(a[j],b[j],cp),c[j],hp);}
 el.style.left=o[0].toFixed(1)+"px";el.style.top=o[1].toFixed(1)+"px";el.style.width=o[2].toFixed(1)+"px";el.style.height=o[3].toFixed(1)+"px";
 if(rad)el.style.borderRadius=(o[3]/2).toFixed(1)+"px";}
var strokeOn=false;
function setStroke(on){ if(on===strokeOn)return; strokeOn=on;
 for(var s=0;s<strokeSet.length;s++){ if(on)strokeSet[s].classList.add("gstroke"); else strokeSet[s].classList.remove("gstroke"); } }

function render(t){
 var z=eio(sp(t,0,T.zoom));
 var creep=1+CREEP*sp(t,T.zoom,T.scan+SCAN)-CREEP*sp(t,T.gain,T.gain+1.2);
 cam.style.transform="translate("+lp(CAM.tx,0,z).toFixed(1)+"px,"+lp(CAM.ty,0,z).toFixed(1)+"px) scale("+lp(CAM.s,1,z).toFixed(4)+") translate(540px,675px) scale("+creep.toFixed(4)+") translate(-540px,-675px)";
 var sc=scrollAt(t), v=Math.abs((sc-scrollAt(Math.max(0,t-0.03)))/0.03);
 var bl=Math.min(28,v/160), sy=1+Math.min(0.09,v/44000);
 var drain=sp(t,T.resume,T.resume+0.3);
 var tf="translateY("+sc.toFixed(1)+"px) scaleY("+sy.toFixed(3)+")";
 base.style.transform=tf; keepL.style.transform=tf;
 var inStroke=(t>=T.stroke&&t<T.stroke+STROKE);
 setStroke(inStroke);
 var bs=bl>0.25?"blur("+bl.toFixed(1)+"px) ":"";
 base.style.filter=bs+"grayscale("+(inStroke?0:drain).toFixed(2)+")";
 keepL.style.filter=bs+"grayscale("+(inStroke?0:drain*(1-sp(t,T.gain,T.gain+0.8))).toFixed(2)+")";
 if(inStroke){var ang=(sp(t,T.stroke,T.stroke+STROKE)*360).toFixed(1)+"deg";
  base.style.setProperty("--ga",ang); keepL.style.setProperty("--ga",ang);}
 var sp2=sp(t,T.scan,T.scan+SCAN);
 if(sp2>0&&sp2<1){
  var by=lp(-620,1200,sp2), fade=Math.min(1,Math.min(sp2,1-sp2)/0.09);
  scan.style.transform="translateY("+by.toFixed(1)+"px)";
  scan.style.opacity=fade.toFixed(3);
  edge.style.transform="translateY("+(by+441).toFixed(1)+"px)";
  edge.style.opacity=fade.toFixed(3);
  wash.style.opacity=(0.17*Math.sin(sp2*Math.PI)).toFixed(3);
 } else { scan.style.opacity=0; edge.style.opacity=0; wash.style.opacity=0; }
 var chOp=1-sp(t,T.hero,T.hero+0.35);
 chrome.style.opacity=chOp.toFixed(3);
 var php=sp(t,T.phone,T.phone+PH);
 if(php>0){
  var pe=ob(php);
  phone.style.transform="translate("+lp(-71,0,pe).toFixed(1)+"px,"+lp(95,0,pe).toFixed(1)+"px) scale("+lp(2.47,1,pe).toFixed(3)+")";
  phone.style.opacity=(Math.min(1,php/0.16)*chOp).toFixed(3);
  acct.style.opacity=(1-Math.min(1,php/0.22)).toFixed(3);
 } else { phone.style.opacity=0; acct.style.opacity=1; }
 var hp=oc(sp(t,T.hero,T.hero+0.95));
 var press=0.5+0.7*sp(t,T.zoom,T.scan+SCAN)-0.75*sp(t,T.gain,T.gain+1.0);
 vig.style.opacity=(Math.max(0.32,press)*(1-sp(t,T.hero,T.hero+0.4))).toFixed(3);
 var dout=1-sp(t,T.devOut,T.devOut+0.5);
 dev.style.opacity=dout.toFixed(3);
 floor.style.opacity=dout.toFixed(3);
 var hand=sp(t,T.hand,T.hand+0.3);
 var mv=oc(sp(t,T.move,T.move+0.85));
 fin.style.opacity=hand.toFixed(3);
 fin.style.transform="translate("+lp(230,FX,mv).toFixed(1)+"px,"+lp(200,FY,mv).toFixed(1)+"px) scale("+lp(1,FS,mv).toFixed(4)+")";
 end.style.opacity=oc(sp(t,T.endIn,T.endIn+0.55)).toFixed(3);
 document.getElementById("n1").style.transform="translateY("+(26*(1-oc(sp(t,T.endIn,T.endIn+0.5)))).toFixed(1)+"px)";
 document.getElementById("n2").style.transform="translateY("+(26*(1-oc(sp(t,T.endIn+0.14,T.endIn+0.66)))).toFixed(1)+"px)";
 for(var i=0;i<cards.length;i++){var cd=cards[i];
  if(cd.keep)continue;
  var x=cd.x,y=cd.y,rot=0,op=1,zs=1;
  var e2=sp(t,T.vanish+cd.dly,T.vanish+cd.dly+0.52);
  if(e2>0){var e=oc(e2);x=cd.x+(cd.ex-cd.x)*e;rot=cd.rot*e;zs=1+0.10*e;op=1-e2;
   cd.el.style.boxShadow="0 "+(4+26*e).toFixed(0)+"px "+(12+44*e).toFixed(0)+"px rgba(20,33,50,"+(0.07+0.16*e).toFixed(2)+")";}
  cd.el.style.transform="translate("+x.toFixed(1)+"px,"+y.toFixed(1)+"px) rotate("+rot.toFixed(1)+"deg) scale("+zs.toFixed(3)+")";
  cd.el.style.opacity=op.toFixed(3);
 }
 for(var k=0;k<kp.length;k++){var K=kp[k],q=K.q,isH=K.k===HERO,h=isH?hp:0;
  var gk=isH?sp(t,T.green,T.green+0.45):0;
  var cA=mix(BLU2,GRN2,gk),cB=mix(BLU,GRN,gk);
  var bp=sp(t,T.gain+K.k*0.2,T.gain+0.42+K.k*0.2);
  var pulse=Math.sin(sp(t,T.pulse+K.k*0.47,T.pulse+K.k*0.47+0.47)*Math.PI);
  q.bg.style.opacity=bp.toFixed(3);
  q.bg.style.transform="scale("+(0.35+0.65*ob(bp)).toFixed(3)+")";
  q.bg.style.background="linear-gradient(160deg,"+cA+","+cB+")";
  q.bg.style.boxShadow="0 "+(4+8*h).toFixed(0)+"px "+(14+20*h).toFixed(0)+"px "+(gk>0.5?"rgba(12,140,95,.5)":"rgba(18,80,180,.45)");
  var rr=Math.max(sp(t,T.gain+0.1+K.k*0.2,T.gain+0.72+K.k*0.2),gk>0?sp(t,T.green,T.green+0.95):0,isH?sp(t,T.hero+0.55,T.hero+1.5):0);
  q.rg.style.opacity=(rr>0&&rr<1?(1-rr)*0.6:0).toFixed(3);
  q.rg.style.transform="scale("+(1+rr*0.6).toFixed(3)+")";
  q.rg.style.borderColor=cB;
  var cp=oc(sp(t,T.conv+K.k*0.09,T.conv+0.8+K.k*0.09));
  var x=lp(lp(K.x,BX,cp),HX,h),y=lp(lp(K.y,K.ty,cp),HY,h);
  var ps=1+0.085*pulse*(1-h);
  K.el.style.width=lp(lp(CW,BW,cp),HW,h).toFixed(1)+"px";
  K.el.style.height=lp(lp(CH,BH,cp),HH,h).toFixed(1)+"px";
  K.el.style.borderRadius=lp(lp(15,22,cp),30,h).toFixed(1)+"px";
  K.el.style.transform="translate("+x.toFixed(1)+"px,"+y.toFixed(1)+"px) scale("+ps.toFixed(3)+")";
  K.el.style.background=h>0.01?"linear-gradient(170deg,#FFFFFF 0%,#F7FCFA 52%,#EDF7F2 100%)":"linear-gradient(168deg,#FFFFFF 0%,"+K.tint+" 100%)";
  K.el.style.border=(t>T.gain-0.05?lp(lp(2.5,2,cp),3,h).toFixed(1)+"px solid "+cA:"0 solid transparent");
  K.el.style.boxShadow="0 "+(2+16*cp+16*pulse+16*h).toFixed(0)+"px "+(8+38*cp+34*pulse+30*h).toFixed(0)+"px "+(gk>0.5?"rgba(12,110,78,":"rgba(18,64,140,")+(0.07+0.15*cp+0.13*pulse+0.06*h).toFixed(2)+")";
  K.el.style.opacity=(isH?(1-hand):(1-sp(t,T.hero,T.hero+0.4))).toFixed(3);
  bx(q.halo,S.halo,L.halo,H.halo,cp,h);
  q.halo.style.opacity=(h*0.95).toFixed(3);
  bx(q.av,S.av,L.av,H.av,cp,h);
  bx(q.b1,S.b1,L.b1,H.b1,cp,h,1);
  bx(q.b2,S.b2,L.b2,H.b2,cp,h,1);
  bx(q.b3,S.b3,L.b3,H.b3,cp,h,1);
  bx(q.b4,S.b4,L.b4,H.b4,cp,h,1);
  bx(q.bg,S.bg,L.bg,H.bg,cp,h);
  bx(q.rg,S.rg,L.rg,H.rg,cp,h);
  q.tag.style.opacity=(1-cp).toFixed(3);
 }
 var lab=BEATS[BEATS.length-1][1];
 for(var z2=0;z2<BEATS.length;z2++){if(t<BEATS[z2][0]){lab=BEATS[z2][1];break;}}
 document.getElementById("beat").textContent=lab;
 document.getElementById("tl").textContent=t.toFixed(1)+"s / "+DUR+"s";
}

/* ================================================================
   PLAYBACK + EXPORT HOOKS
   window.SHORTLIST.setTime(sec) — jump to an exact time, paused
   ?clean=1                      — hide the UI chrome for capture
                                   (also automatic when embedded in an iframe)
   space = play/pause   arrow = step 1 frame   shift+arrow = 1 second
   ================================================================ */
var t=0,last=performance.now(),playing=true,drag=false;
var scrub=document.getElementById("scrub"),pp=document.getElementById("pp");
var embedded=(window.self!==window.top);
if(new URLSearchParams(location.search).get("clean")||embedded){document.body.classList.add("clean");}
function loop(now){var dt=(now-last)/1000;last=now;if(dt>0.2)dt=0.02;
 if(playing&&!drag){t=(t+dt)%DUR;scrub.value=Math.round(t/DUR*5100);}
 render(t);requestAnimationFrame(loop);}
scrub.addEventListener("input",function(){drag=true;t=scrub.value/5100*DUR;render(t);});
scrub.addEventListener("change",function(){drag=false;});
pp.addEventListener("click",function(){playing=!playing;pp.innerHTML=playing?"&#10073;&#10073;":"&#9654;";});
document.addEventListener("keydown",function(e){
  if(e.key===" "){e.preventDefault();pp.click();}
  if(e.key==="ArrowRight"){playing=false;pp.innerHTML="&#9654;";t=Math.min(DUR,t+(e.shiftKey?1:1/30));render(t);scrub.value=Math.round(t/DUR*5100);}
  if(e.key==="ArrowLeft"){playing=false;pp.innerHTML="&#9654;";t=Math.max(0,t-(e.shiftKey?1:1/30));render(t);scrub.value=Math.round(t/DUR*5100);}
});
window.SHORTLIST={DUR:DUR,T:T,
  setTime:function(sec){playing=false;t=cl(sec,0,DUR);render(t);scrub.value=Math.round(t/DUR*5100);},
  pause:function(){playing=false;},
  play:function(){playing=true;last=performance.now();},
  restart:function(){t=0;playing=true;last=performance.now();render(0);}};
/* When embedded, the parent page drives play/pause from its scroll position
   (see main.js). Start paused on frame 0 so nothing runs off-screen. */
if(embedded){playing=false;render(0);}
requestAnimationFrame(loop);
})();
</script>
