<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="Seven sales tools converging into the RemoteReps operations platform" style="font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',Helvetica,Arial,sans-serif">
  <defs>
    <radialGradient id="stage" cx="50%" cy="38%" r="80%">
      <stop offset="0" stop-color="#26364B"/>
      <stop offset="0.55" stop-color="#151F2D"/>
      <stop offset="1" stop-color="#0B1119"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FA3BC" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#8FA3BC" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="40" stdDeviation="34" flood-color="#04090F" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="800" height="1000" fill="url(#stage)"/>

  <!-- Seven disconnected tools -->
  <g stroke="url(#fade)" stroke-width="1.5" fill="none">
    <path d="M132 118 C 132 260, 400 250, 400 372"/>
    <path d="M400 118 C 400 250, 400 250, 400 372"/>
    <path d="M668 118 C 668 260, 400 250, 400 372"/>
    <path d="M210 200 C 210 300, 400 290, 400 372"/>
    <path d="M590 200 C 590 300, 400 290, 400 372"/>
    <path d="M300 282 C 300 330, 400 330, 400 372"/>
    <path d="M500 282 C 500 330, 400 330, 400 372"/>
  </g>
  <g font-size="19" font-weight="500" fill="#E7EBF1" text-anchor="middle">
    <g><rect x="32" y="60" width="200" height="58" rx="29" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.16"/><text x="132" y="96">Twilio + CloudTalk</text></g>
    <g><rect x="320" y="60" width="160" height="58" rx="29" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.16"/><text x="400" y="96">Zapier</text></g>
    <g><rect x="568" y="60" width="200" height="58" rx="29" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.16"/><text x="668" y="96">Spreadsheets</text></g>
    <g><rect x="100" y="142" width="220" height="58" rx="29" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.16"/><text x="210" y="178">HubSpot + Calendly</text></g>
    <g><rect x="480" y="142" width="220" height="58" rx="29" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.16"/><text x="590" y="178">Meta Business</text></g>
    <g><rect x="212" y="224" width="176" height="58" rx="29" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.16"/><text x="300" y="260">Hubstaff</text></g>
    <g><rect x="412" y="224" width="176" height="58" rx="29" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.16"/><text x="500" y="260">Manual QA</text></g>
  </g>
  <circle cx="400" cy="372" r="7" fill="#0071E3"/>

  <!-- One platform -->
  <g filter="url(#shadow)">
    <rect x="56" y="400" width="688" height="600" rx="34" fill="#FFFFFF"/>
  </g>
  <!-- window chrome -->
  <g>
    <rect x="92" y="438" width="40" height="40" rx="12" fill="#0071E3"/>
    <path d="M102 460 a10 10 0 0 0 20 0" stroke="#fff" stroke-width="5" stroke-linecap="round" fill="none"/>
    <text x="146" y="465" font-size="22" font-weight="600" fill="#1D1D1F" letter-spacing="-0.3">RemoteReps</text>
    <circle cx="700" cy="458" r="18" fill="#E8ECF1"/>
  </g>
  <!-- persona tabs -->
  <g font-size="16" font-weight="500" text-anchor="middle">
    <rect x="92" y="506" width="128" height="40" rx="20" fill="#F0F2F5"/><text x="156" y="532" fill="#6E6E73">Executive</text>
    <rect x="230" y="506" width="128" height="40" rx="20" fill="#1D1D1F"/><text x="294" y="532" fill="#FFFFFF">Manager</text>
    <rect x="368" y="506" width="128" height="40" rx="20" fill="#F0F2F5"/><text x="432" y="532" fill="#6E6E73">Client</text>
    <rect x="506" y="506" width="128" height="40" rx="20" fill="#F0F2F5"/><text x="570" y="532" fill="#6E6E73">Rep</text>
  </g>
  <!-- KPI tiles -->
  <g>
    <rect x="92" y="576" width="196" height="120" rx="20" fill="#F5F5F7"/>
    <text x="112" y="608" font-size="14" font-weight="500" fill="#6E6E73">Decision makers reached</text>
    <text x="112" y="666" font-size="40" font-weight="700" fill="#1D1D1F" letter-spacing="-1">68%</text>

    <rect x="302" y="576" width="196" height="120" rx="20" fill="#F5F5F7"/>
    <text x="322" y="608" font-size="14" font-weight="500" fill="#6E6E73">Appointments set</text>
    <text x="322" y="666" font-size="40" font-weight="700" fill="#1D1D1F" letter-spacing="-1">24</text>

    <rect x="512" y="576" width="196" height="120" rx="20" fill="#F5F5F7"/>
    <text x="532" y="608" font-size="14" font-weight="500" fill="#6E6E73">Calls reviewed</text>
    <text x="532" y="666" font-size="40" font-weight="700" fill="#1D1D1F" letter-spacing="-1">100%</text>
  </g>
  <!-- AI layer -->
  <rect x="92" y="722" width="616" height="84" rx="20" fill="#0071E3"/>
  <text x="120" y="756" font-size="16" font-weight="600" fill="#FFFFFF">AI at the point of work</text>
  <text x="120" y="784" font-size="14" fill="#FFFFFF" fill-opacity="0.85">Call QA  ·  Coaching  ·  Live co-pilot  ·  Voice &amp; SMS agents</text>
  <!-- call rows -->
  <g font-size="14">
    <g>
      <circle cx="116" cy="852" r="14" fill="#DDE3EA"/>
      <rect x="146" y="843" width="190" height="9" rx="4.5" fill="#D2D2D7"/>
      <rect x="146" y="859" width="120" height="7" rx="3.5" fill="#E6E6EA"/>
      <rect x="540" y="836" width="168" height="32" rx="16" fill="#E9F5EC"/><text x="624" y="857" text-anchor="middle" font-weight="600" fill="#1F8A3C">Appointment · 92</text>
    </g>
    <g>
      <circle cx="116" cy="908" r="14" fill="#DDE3EA"/>
      <rect x="146" y="899" width="230" height="9" rx="4.5" fill="#D2D2D7"/>
      <rect x="146" y="915" width="100" height="7" rx="3.5" fill="#E6E6EA"/>
      <rect x="540" y="892" width="168" height="32" rx="16" fill="#F0F2F5"/><text x="624" y="913" text-anchor="middle" font-weight="600" fill="#6E6E73">Callback · 78</text>
    </g>
    <g>
      <circle cx="116" cy="964" r="14" fill="#DDE3EA"/>
      <rect x="146" y="955" width="170" height="9" rx="4.5" fill="#D2D2D7"/>
      <rect x="146" y="971" width="130" height="7" rx="3.5" fill="#E6E6EA"/>
      <rect x="540" y="948" width="168" height="32" rx="16" fill="#F0F2F5"/><text x="624" y="969" text-anchor="middle" font-weight="600" fill="#6E6E73">No answer</text>
    </g>
  </g>
</svg>
